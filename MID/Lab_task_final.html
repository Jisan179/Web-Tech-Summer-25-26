<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 20px;
            background: white;
            color: black;
        }

        h1
        {
            font-size: 40px;
        }

        button
        {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }

        nav button
        {
            margin: 10px;
        }

        .section
        {
            display: none;
            border: 1px solid gray;
            padding: 20px;
            margin-top: 20px;
        }

        input, textarea
        {
            width: 250px;
            padding: 8px;
            margin: 8px;
        }

        .error
        {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>My Portfolio</h1>

    <h2 id="Greeting"></h2>

    <button id="ThemeBtn" onclick="SwitchTheme()">Dark Mode</button>

    <br><br>

    <nav>
        <button onclick="ShowSection('about')">About</button>
        <button onclick="ShowSection('projects')">Projects</button>
        <button onclick="ShowSection('contact')">Contact</button>
    </nav>

    <!-- About -->
    <div id="about" class="section">
        <h2>About Me</h2>
        <p>
            Hello! I am a CSE student.
            I enjoy creating websites using HTML, CSS and JavaScript.
        </p>
    </div>

    <!-- Projects -->
    <div id="projects" class="section">
        <h2>Projects</h2>

        <p>Portfolio Website</p>
        <p>Calculator</p>
        <p>Light Switch Project</p>
    </div>

    <!-- Contact -->
    <div id="contact" class="section">

        <h2>Contact Me</h2>

        <input type="text" id="name" placeholder="Enter Name">
        <br>
        <span id="nameError" class="error"></span>

        <br>

        <input type="text" id="email" placeholder="Enter Email">
        <br>
        <span id="emailError" class="error"></span>

        <br>

        <textarea id="message" rows="5" placeholder="Enter Message"></textarea>
        <br>
        <span id="messageError" class="error"></span>

        <br>

        <button onclick="ValidateForm()">Submit</button>

    </div>

<script>

    // Greeting
    function Greeting()
    {
        var hour = new Date().getHours();
        var greet = document.getElementById("Greeting");

        if(hour < 12)
        {
            greet.innerHTML = "Good Morning";
        }
        else if(hour < 18)
        {
            greet.innerHTML = "Good Afternoon";
        }
        else
        {
            greet.innerHTML = "Good Evening";
        }
    }

    Greeting();


    // Theme Switch
    function SwitchTheme()
    {
        var body = document.body;
        var btn = document.getElementById("ThemeBtn");

        if(body.style.background == "black")
        {
            body.style.background = "white";
            body.style.color = "black";
            btn.innerHTML = "Dark Mode";
        }
        else
        {
            body.style.background = "black";
            body.style.color = "white";
            btn.innerHTML = "Light Mode";
        }
    }


    // Show Sections
    function ShowSection(id)
    {
        document.getElementById("about").style.display = "none";
        document.getElementById("projects").style.display = "none";
        document.getElementById("contact").style.display = "none";

        document.getElementById(id).style.display = "block";
    }

    // Show About first
    ShowSection("about");


    // Contact Form Validation
    function ValidateForm()
    {
        var name = document.getElementById("name").value;
        var email = document.getElementById("email").value;
        var message = document.getElementById("message").value;

        document.getElementById("nameError").innerHTML = "";
        document.getElementById("emailError").innerHTML = "";
        document.getElementById("messageError").innerHTML = "";

        var valid = true;

        if(name == "")
        {
            document.getElementById("nameError").innerHTML = "Name is required.";
            valid = false;
        }

        var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if(!email.match(emailPattern))
        {
            document.getElementById("emailError").innerHTML = "Enter a valid email.";
            valid = false;
        }

        if(message.length < 10)
        {
            document.getElementById("messageError").innerHTML = "Message must be at least 10 characters.";
            valid = false;
        }

        if(valid)
        {
            alert("Form Submitted Successfully!");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        }
    }

</script>

</body>
</html>
